name: Build and Release APK

on:
  push:
    branches: [ "main" ] # Сборка при пуше в основную ветку
  workflow_dispatch:      # Позволяет запустить сборку кнопкой в Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Важно для подгрузки jni/deltachat-core-rust
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27 # Версия из вашего preview-apk.yml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-android, x86_64-linux-android, i686-linux-android

      - name: Build Rust Core
        run: |
          # Запуск вашего скрипта сборки ядра
          chmod +x scripts/ndk-make.sh
          ./scripts/ndk-make.sh

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: messenger-p2p-debug
          path: app/build/outputs/apk/debug/app-debug.apk
