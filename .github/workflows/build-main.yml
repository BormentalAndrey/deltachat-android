name: Build and Release APK

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read
actions: write

jobs:
build:
runs-on: ubuntu-latest

```
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"
  TERMUX_APP_PACKAGE_MANAGER: apt

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      submodules: recursive
      fetch-depth: 0
      persist-credentials: false

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17
      cache: gradle

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Setup Android NDK
    uses: nttld/setup-ndk@v1
    id: ndk
    with:
      ndk-version: r27

  - name: Install Rust toolchain
    uses: dtolnay/rust-toolchain@stable
    with:
      targets: |
        aarch64-linux-android
        armv7-linux-androideabi
        x86_64-linux-android
        i686-linux-android

  - name: Cache Rust dependencies
    uses: Swatinem/rust-cache@v2
    with:
      workspaces: |
        jni/deltachat-core-rust

  - name: Grant execute permissions
    run: |
      chmod +x gradlew
      chmod +x scripts/ndk-make.sh

  - name: Build Rust core
    env:
      ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
      NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
    run: |
      echo "stable" > scripts/rust-toolchain
      ./scripts/ndk-make.sh

  - name: Build Debug APK
    run: |
      ./gradlew assembleDebug --stacktrace

  - name: Show generated APK files
    run: |
      echo "Searching APK files..."
      find . -type f -name "*.apk"

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: messenger-p2p-debug
      path: |
        **/build/outputs/apk/debug/*.apk
        **/build/outputs/apk/*debug*.apk
      if-no-files-found: error
      retention-days: 7
      compression-level: 6
```
