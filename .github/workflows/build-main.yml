name: Build and Release APK

on:
  push:
    branches: [ "main" ] # Сборка запускается при каждом пуше в ветку main
  workflow_dispatch:      # Позволяет запускать сборку вручную через вкладку Actions

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Получение кода репозитория вместе с субмодулями (Rust ядро)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      # 2. Настройка Java (необходима для Gradle и Android SDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Настройка Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Настройка NDK (версия r27, как в ваших логах)
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      # 5. Настройка Rust и кэширование (убраны проблемные 32-битные таргеты)
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: jni/deltachat-core-rust

      # 6. Сборка нативного Rust ядра
      - name: Build Rust Core
        run: |
          # Даем права на исполнение и запускаем скрипт сборки
          chmod +x scripts/ndk-make.sh
          ./scripts/ndk-make.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      # 7. Сборка самого Android приложения (APK)
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 8. Сохранение готового файла в артефакты GitHub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: messenger-p2p-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
