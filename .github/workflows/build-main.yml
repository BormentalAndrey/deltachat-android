name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            jni/deltachat-core-rust

      - name: Grant execute permissions
        run: |
          chmod +x gradlew
          chmod +x scripts/ndk-make.sh

      - name: Build Rust core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          echo "stable" > scripts/rust-toolchain
          ./scripts/ndk-make.sh

      - name: Configure local.properties for Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          echo "✅ local.properties created:"
          cat local.properties
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      - name: Build Debug APK
        run: |
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace --info

      - name: Show generated APK files
        run: |
          echo "=== Поиск APK файлов ==="
          find . -type f -name "*.apk" -exec ls -lh {} \;
          echo ""
          echo "=== Проверка app/build/outputs ==="
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "Папка apk не существует"
          echo ""
          echo "=== Проверка всех build/outputs ==="
          find app/build -type d -name "apk" 2>/dev/null || echo "Нет папок apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: messenger-p2p-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*debug*.apk
            **/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Fallback - Save build logs if APK not found
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            app/build/outputs/logs/
            **/build/reports/
          retention-days: 7
